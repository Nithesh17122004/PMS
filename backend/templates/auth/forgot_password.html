<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="robots" content="noindex">
  <title>Forgot password · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark brand-mark-lg">CF</div>
      <h1>Recover access<br />to your clinic.</h1>
      <p>Enter the email address tied to your ClinicFlow account and we will send a secure reset link.</p>
      <div class="row mt24" style="margin-top:auto;"><span class="badge" style="background:rgba(255,255,255,0.12);color:#eaf2fc">Time-limited tokens</span></div>
    </section>
    <section class="auth-panel">
      <h2>Forgot password</h2>
      <p class="muted">We'll email you a reset link</p>
      <form id="forgot-form" class="form-stack" novalidate>
        <label class="field"><span>Email address</span><input class="input" id="forgot-email" type="email" autocomplete="email" required></label>
        <div class="form-error" id="forgot-message" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <div class="mt16"><a href="/login" class="muted small">Back to sign in</a></div>
      <div class="mt16"><input class="input" id="forgot-demo-url" readonly placeholder="Demo reset link"/></div>
    </section>
  </main>
  <script src="{{ asset('js/forgot.js') }}"></script>
</body>
</html>
