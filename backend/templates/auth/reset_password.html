<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="robots" content="noindex">
  <title>Reset password · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark brand-mark-lg">CF</div>
      <h1>Secure access,<br />restored.</h1>
      <p>Choose a strong password to regain access to your clinic workspace.</p>
    </section>
    <section class="auth-panel">
      <h2>Set a new password</h2>
      <form id="reset-form" class="form-stack" novalidate>
        <input type="hidden" id="reset-token" name="token" value="{{ token }}">
        <label class="field"><span>New password</span><input type="password" id="reset-new-password" name="new_password" autocomplete="new-password" required></label>
        <label class="field"><span>Confirm new password</span><input type="password" id="reset-confirm" name="confirm_password" autocomplete="new-password" required></label>
        <p class="muted small">At least 10 characters with uppercase, lowercase, a number and a symbol.</p>
        <div class="form-error" id="reset-error" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
      <a href="/login" class="muted small">Back to sign in</a>
    </section>
  </main>
  <script src="{{ asset('js/reset.js') }}"></script>
</body>
</html>
