name: ClinicFlow tests

on:
  push:
    branches:
      - main
      - feature/first-time-setup
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run backend and API tests
        env:
          APP_ENV: testing
          TEST_DATABASE_URL: sqlite:///:memory:
        run: pytest
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: find backend/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install frontend test dependency
        run: npm install --no-audit --no-fund
      - name: Run frontend modal regression tests
        run: npm run test:frontend
